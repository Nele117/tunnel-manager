services:
  tunnel-manager:
    build: .
    image: local/tunnel-manager:1.4.1
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "${BIND_IP:-127.0.0.1}:${MANAGER_PORT:-8080}:8080"
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Run ./install.sh first}"
      MANAGER_HOST_IP: "${BIND_IP:-127.0.0.1}"
      MANAGER_PORT: "${MANAGER_PORT:-8080}"
      SECURE_COOKIE: "${SECURE_COOKIE:-0}"
    volumes:
      - manager-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  manager-data:
