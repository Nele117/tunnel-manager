function routesPage(){const rr=state.routes||[],en=rr.filter(r=>r.enabled).length;return header('Public routes','Manage published services.',btn('Add route','add','plus','primary'))+`<div class="metrics">${metric('Connector',`<span class="dot ${connectionState()[1]}"></span><span class="status-${connectionState()[1]}">${connectionState()[0]}</span>`,esc(state.tunnel_name),'activity')}${metric('Managed routes',rr.length,`${en} enabled · ${rr.length-en} paused`,'routes')}${metric('Protected routes',rr.filter(r=>r.access==='email'&&r.enabled).length,`${rr.filter(r=>r.access==='public'&&r.enabled).length} public routes enabled`,'shield')}</div><div class="panel"><div class="panel-head"><div><h2>Published applications</h2></div>${btn('Pause settings','fallback','settings')}</div><div class="toolbar"><div class="search">${I('search')}<input id="search" placeholder="Search routes…" aria-label="Search routes" value="${esc(filter)}"></div><select id="filter" aria-label="Filter by status"><option value="all">All statuses</option><option value="enabled" ${statusFilter==='enabled'?'selected':''}>Enabled</option><option value="disabled" ${statusFilter==='disabled'?'selected':''}>Paused</option></select></div><div class="table-wrap"><table><thead><tr><th>Application</th><th>Public hostname</th><th>Local destination</th><th>Access</th><th>Route status</th><th style="text-align:right">Actions</th></tr></thead><tbody id="route-rows">${tableRows()}</tbody></table></div><div class="table-foot"><span>${rr.length} managed routes</span><span>One tunnel · ${state.zones?.length||0} domain(s)</span></div></div>${remote.unmanaged?.length?`<div class="panel"><div class="panel-head"><div><h2>Existing Cloudflare rules</h2><p>Read-only rules not created by this manager.</p></div></div><div class="table-wrap"><table><thead><tr><th>Hostname</th><th>Origin</th></tr></thead><tbody>${remote.unmanaged.map(r=>`<tr><td>${esc(r.hostname)}${esc(r.path||'')}</td><td class="mono">${esc(r.service)}</td></tr> function tokenGuide(){const table=rows=>`<table class="permission-table"><thead><tr><th>Permission group</th><th>Access</th></tr></thead><tbody>${rows.map(([name,level])=>`<tr><td>${name}</td><td>${level}</td></tr>`).join('')}</tbody></table>`;const content=`<div class="guide"><div class="guide-step"><span class="guide-number">1</span><div><h3>Open Cloudflare API tokens</h3><p>Click Create Token, enter a name, then choose Start from scratch.</p><a class="btn" href="https://dash.cloudflare.com/profile/api-tokens" target="_blank" rel="noopener noreferrer">Open API tokens ${I('external')}</a></div></div><div class="guide-step"><span class="guide-number">2</span><div><h3>Account policy</h3><p>Choose Start with an Account policy. Select your account and search for each permission below.</p>${table([['Cloudflare Tunnel','Edit'],['Access: Apps and Policies','Edit'],['Access: Organizations, Identity Providers, and Groups','Read'],['Cloudflare One Networks','Edit']])}</div></div><div class="guide-step"><span class="guide-number">3</span><div><h3>Zone policy</h3><p>Click Add new policy → Zone policy. Select the domains you want to manage.</p>${table([['DNS','Edit'],['Zone','Read']])}</div></div><div class="guide-step"><span class="guide-number">4</span><div><h3>Create and connect</h3><p>Choose an expiration, leave IP filtering empty unless you have a fixed outgoing IP, then Continue to summary → Create Token. Copy the token into Tunnel Manager and click Find domains.</p></div></div><div class="guide-footer">Edit may be labelled Write. <a href="https://developers.cloudflare.com/fundamentals/api/get-started/create-token/" target="_blank" rel="noopener noreferrer">Cloudflare documentation ${I('external')}</a></div></div>`;lastFocus=document.activeElement;modal={help:true};$('#overlay').innerHTML=`<div class="modal-bg"><section class="modal guide-dialog" role="dialog" aria-modal="true" aria-labelledby="guide-title"><div class="modal-head"><div><h2 id="guide-title">Create an API token</h2><p>Permissions for all Tunnel Manager features.</p></div><button type="button" class="btn icon" data-action="close" aria-label="Close">${I('close')}</button></div><div class="modal-body">${content}</div><div class="modal-foot"><button type="button" class="btn primary" data-action="close">Done</button></div></section></div>`;$('#overlay .modal-head button').focus()}
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function confirmedMutation(path,data,verify){await refreshQueue;let result;try{result=await api(path,data)}catch(e){if(e.httpStatus&&e.httpStatus<500)throw e;if(!authenticated&&!DEMO)throw e;result={pending:true}}if(!result.pending){return true}const msg=$('#modal-pending');if(msg)msg.innerHTML='<span class="spinner" aria-hidden="true"></span> Waiting for Cloudflare confirmation…';const submit=$('#modal-submit');if(submit)submit.textContent='Confirming…';for(const wait of [0,1500,3000,5000,8000]){if(wait)await delay(wait);try{state=await api('status');if(state.recovery_error&&!state.recovery_pending)throw Object.assign(Error(state.recovery_error),{conflict:true});if(!state.recovery_pending&&await verify())return true;if(!state.recovery_pending&&!state.recovery_error)throw Object.assign(Error('Change not confirmed. Check the current route before retrying.'),{conflict:true})}catch(e){if(e.conflict||(!authenticated&&!DEMO))throw e}}if(!state.recovery_error){state.recovery_error='Waiting for Cloudflare confirmation.';state.recovery_pending=true}toast('Confirmation pending. Checking automatically.');return false}
function showModal(title,desc,body,submit,handler){lastFocus=document.activeElement;modal={handler};$('#overlay').innerHTML=`<div class="modal-bg"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">${title}</h2><p>${desc}</p></div><button class="btn icon" data-action="close" aria-label="Close">${I('close')}</button></div><form id="modal-form" style="display:contents"><div class="modal-body">${body}<div class="pending-message" id="modal-pending" role="status" aria-live="polite"></div><div class="form-error" id="modal-error" role="alert"></div></div><div class="modal-foot"><button type="button" class="btn" data-action="close">Cancel</button><button type="submit" class="btn ${/^(Delete|Remove)/.test(submit)?'danger-solid':'primary'}" id="modal-submit">${submit}</button></div></form></section></div>`;$('#modal-form').onsubmit=async e=>{e.preventDefault();let b=$('#modal-submit');const original=b.textContent;if(modalBusy)return;modalBusy=true;b.disabled=true;b.textContent='Working…';$('#modal-error').textContent='';$('#modal-pending').textContent='';try{await handler();await refresh(page==='private');modalBusy=false;closeModal(true);renderStatus(true)}catch(x){if($('#modal-pending'))$('#modal-pending').textContent='';if($('#modal-error'))$('#modal-error').textContent=x.message;b.disabled=false;b.textContent=original}finally{modalBusy=false}};setTimeout(()=>($('#overlay input:not([type=checkbox]):not([type=radio]):not(:disabled)')||$('#overlay .modal-foot button'))?.focus(),20)}

function routeForm(r){let u=r?new URL(r.service):null;let body=`<div class="field"><label for="rname">Application name</label><input id="rname" placeholder="e.g. OpenMediaVault" required maxlength="80" value="${esc(r?.name||'')}"></div>${r?`<div class="field"><label>Hostname</label><input disabled value="${esc(r.hostname)}"><small>To change hostname or access policy, create a replacement route and remove this one.</small></div>`:`<div class="field-row host"><div class="field"><label for="sub">Subdomain</label><input id="sub" placeholder="omv" pattern="[A-Za-z0-9][A-Za-z0-9-]*" required></div><div class="field"><label for="domain">Domain</label><select id="domain">${state.zones.filter(z=>z.status==='active').map(z=>`<option>${esc(z.name)}</option>`).join('')}</select></div></div><div class="route-preview">Public URL<strong id="hostname-preview">Enter a subdomain</strong></div>`}<div class="field-row origin"><div class="field"><label for="scheme">Protocol</label><select id="scheme"><option value="http">HTTP</option><option value="https" ${u?.protocol==='https:'?'selected':''}>HTTPS</option></select></div><div class="field"><label for="ip">Local IP address</label><input id="ip" placeholder="192.168.1.124" required value="${esc(u?.hostname||'')}"></div><div class="field"><label for="port">Port</label><input id="port" type="number" min="1" max="65535" required value="${esc(r?(u.port||(u.protocol==='https:'?443:80)):'80')}"></div></div><div style="display:flex;align-items:center;gap:9px;margin:-5px 0 15px"><button type="button" class="btn small" data-action="probe">${I('activity')} Test connection</button><small id="probe-result"></small></div><details style="margin-bottom:16px"><summary class="muted" style="cursor:pointer;font-size:12px">Origin TLS options</summary><div class="field" style="margin:10px 0 0"><label for="tls">Origin certificate hostname (optional)</label><input id="tls" placeholder="server.internal" value="${esc(r?.origin_tls_name||'')}"><small>Certificate );$('#domain').addEventListener('change',updateHost);updateHost()}if(!r)document.querySelectorAll('input[name=access]').forEach(e=>e.onchange=()=>{const pub=e.value==='public';$('#email-field').classList.toggle('hidden',pub);$('#emails').required=!pub;$('#public-warning').classList.toggle('hidden',!pub);$('#confirm-public').required=pub})}
function originValue(){return `${$('#scheme').value}://${$('#ip').value.trim()}:${$('#port').value}`}
function confirmBox(title,text,verb,handler){showModal(title,'',`<p>${esc(text)}</p>`,verb,handler)}
function renderStatus(full){if(modal||(!full&&$('.sidebar.open')))return;const focus=document.activeElement;const field=focus?.id;const action=focus?.dataset?.action;const selection=field==='search'?[focus.selectionStart,focus.selectionEnd]:null;render();const next=field?document.getElementById(field):action?[...document.querySelectorAll('[data-action]')].find(e=>e.dataset.action===action):null;if(next){next.focus({preventScroll:true});if(selection)next.setSelectionRange(...selection)}}
function refresh(full=false){const run=async()=>{if(!authenticated&&!DEMO)return;try{state=await api('status');renderStatus(full);if(state.configured&&full){try{remote=await api('remote')}catch(e){remote={};toast(e.message,true)}if(page==='private'){try{privateList=await api('private/list');privateError=''}catch(e){privateError=e.message;privateList=[]}}renderStatus(full)}}catch(e){toast('Refresh failed: '+e.message,true);if(full)throw e}};const task=refreshQueue.then(run,run);refreshQueue=task.catch(()=>{});return task}

async function act(action,el){const [a,id]=action.split(':');const r=state.routes?.find(x=>x.id===id);switch(a){case 'nav':page=id;render();await refresh(true);break;case 'menu':$('.sidebar')?.classList.toggle('open');break;case 'theme':localStorage.setItem('tm-theme-v141',document.documentElement.classList.contains('dark')?'light':'dark');theme();if(state.configured)render();break;case 'refresh':await refresh(true);toast('Refreshed');break;case 'logout':await api('logout');authenticated=false;csrf='';state={};login();break;case 'api-help':tokenGuide();break;case 'recovery-clear':confirmBox('Clear unconfirmed update?','Only clear if Cloudflare still shows the previous configuration. A delayed remote write is possible.','Clear update',async()=>{await api('recovery/discard');toast('Pending update cleared')});break;case 'setup-back':setupData=null;setupToken='';setup();break;case 'close':closeModal();break;case 'add':routeForm();break;case 'edit':routeForm(r);break;case 'probe':{let target=$('#probe-result');el.disabled=true;target.textContent='Checking…';try{let p=await api('probe',{service:originValue()});target.textContent=p.detail+(p.ms?' · '+p.ms+' ms':'');target.style.color=p.ok?'var(--green)':'var(--red)'}catch(e){target.textContent=e.message}finally{el.disabled=false}break}case 'verify':{el.disabled=true;try{let p=await api('verify-public',{id});toast(p.detail,!p.ok)}finally{el.disabled=false}break}case 'toggle':{const desired=!r.enabled;const change=async()=>{const ok=await confirmedMutation('route/toggle',{id,enabled:desired},()=>state.routes.some(x=>x.id===id&&x.enabled===desired));if(ok){const current=state.routes.find(x=>x.id===id);if(current)current.enabled=desired;renderStatus(true);toast(desired?'Route resumed':'Route paused')}};if(!desired)confirmBox('Pause route?',`Visitors to ${r.hostname} will see ${fallbackLabel()}.`,'Pause',change);else{await change();await refresh(false)}break}case 'delete':confirmBox('Delete route?',`Remove ${r.hostname}, its DNS record and its managed Access app? The local service is not affected.`,'Delete route',async()=>{await api('route/delete',{id});toast('Route deleted')});break;case 'private-add':showModal('Add private route','Advertise a single private host to your WARP organization.',`<div class="field"><label for="pname">Description</label><input id="pname" placeholder="Jellyfin" required></div><div class="field"><label for="pip">Private IPv4 address</label><input id="pip" placeholder="192.168.1.123" required></div><label class="check"><input id="pconfirm" type="checkbox" required> I have configured WARP enrollment and Gateway access rules for this host. This route covers every port.</label>`,'Add IP route',async()=>{await api('private/add',{name:$('#pname').value,ip:$('#pip').value,confirm:$('#pconfirm').checked});toast('Private route added')});break;case 'private-delete':confirmBox('Remove private route?','Enrolled clients will lose this route through the selected tunnel.','Remove',async()=>{await api('private/delete',{id});toast('Private route removed')});break;case 'connector':confirmBox(state.run_connector?'Stop local connector?':'Start local connector?',state.run_connector?'Routes may become unreachable unless another connector is online.':'The connector will start automatically and reconnect to Cloudflare.',state.run_connector?'Stop connector':'Start connector',async()=>{await api('connector',{run:!state.run_connector});toast('Connector preference saved')});break;case 'fallback':await fallbackForm();break;case 'zones':await api('refresh-zones');await refresh(true);toast('Domains refreshed');break;case 'backup':{let data=await api('backup');let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='tunnel-manager-config.json';a.click();URL.revokeObjectURL(u);break}case 'discover':showModal('Discover local services','Checks common TCP ports on one host.',`<div class="field"><label for="dip">Private IPv4 address</label><input id="dip" placeholder="192.168.1.123" required></div><p id="discovery-result" class="muted"></p>`,'Scan ports',async()=>{let data=await api('discover-lan',{ip:$('#dip').value});$('#discovery-result').textContent=data.ports.length?'Open TCP ports: '+data.ports.join(', '):'No common ports responded.';throw Error('Scan complete. Open ports are not proof of an HTTP service.')});break;case 'demo-link':toast('Preview only — no real hostname is opened.');break}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();if(el.disabled||mutationBusy||modalBusy)return;const action=el.dataset.action;if(state.recovery_error&&/^(toggle|edit|delete|add|fallback|private-add|private-delete|connector|zones)(:|$)/.test(action)){toast('Wait for Cloudflare confirmation before making another change.');return}const busy=/^(toggle|zones|logout|refresh|fallback):?/.test(action);if(busy){mutationBusy=true;el.disabled=true}act(action,el).catch(x=>toast(x.message,true)).finally(()=>{if(busy){mutationBusy=false;el.disabled=false}})});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal();if(e.key==='Tab'&&modal){let els=[...$('#overlay').querySelectorAll('button,input,select,textarea,summary,a')].filter(x=>!x.disabled&&x.getClientRects().length);if(!els.length)return;let first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
(async()=>{try{let s=await (await fetch('/api/session')).json();if(s.authenticated){csrf=s.csrf;await start()}else login()}catch(e){login();toast('Unable to connect to manager.',true)}})();
